<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JokenPô</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">

        <h1>JokenPô</h1>

        <button class="icones-button" id="rock">
            <img src="/assets/img/rock.webp" class="icones-img" alt="rock">
        </button>

        <button class="icones-button" id="paper">
            <img src="/assets/img/paper.webp" class="icones-img" alt="paper">
        </button>

        <button class="icones-button" id="scissors">
            <img src="/assets/img/scissors.webp" class="icones-img" alt="scissors">
        </button>
        <p class="result"></p>
        <div class="conteiner-score">
            <p class="your-score">Sua Pontuação:</p><span class="score">0</span>
        </div>
        <div class="conteiner-score">
            <p class="machine-score">Pontuação da Máquina:</p><span class="score">0</span>
        </div>
    </main>


</body>

</html>
